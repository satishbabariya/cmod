[package]
name = "nested-deps"
version = "0.1.0"
edition = "2023"
description = "Example where a path dependency has its own git dependency"
authors = ["cmod contributors"]
license = "Apache-2.0"

[module]
name = "local.nested_deps"
root = "src/lib.cppm"

[dependencies]
formatter = { path = "libs/formatter" }

[toolchain]
compiler = "clang"
cxx_standard = "20"

[build]
type = "binary"
