<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagon shape -->
  <polygon
    points="64,8 118,36 118,92 64,120 10,92 10,36"
    fill="url(#grad)"
    stroke="#01579b"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Inner hexagon border -->
  <polygon
    points="64,18 108,42 108,86 64,110 20,86 20,42"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.3"
    stroke-linejoin="round"
  />
  <!-- C++ text -->
  <text
    x="64"
    y="58"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="bold"
    fill="#ffffff"
  >C++</text>
  <!-- "mod" text -->
  <text
    x="64"
    y="84"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="600"
    fill="#ffffff"
    opacity="0.9"
  >mod</text>
</svg>
