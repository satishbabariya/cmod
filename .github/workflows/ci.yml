name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "17"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM ${{ env.LLVM_VERSION }} (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ env.LLVM_VERSION }} main"
          sudo apt-get update
          sudo apt-get install -y clang-${{ env.LLVM_VERSION }} llvm-${{ env.LLVM_VERSION }} clang-tools-${{ env.LLVM_VERSION }}
          echo "/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin" >> $GITHUB_PATH
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        run: clang++ --version
      - run: cargo test --all

  # Run integration and E2E tests that exercise real C++ compilation.
  # These are separate because they require LLVM/Clang and take longer.
  e2e:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM ${{ env.LLVM_VERSION }} (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ env.LLVM_VERSION }} main"
          sudo apt-get update
          sudo apt-get install -y clang-${{ env.LLVM_VERSION }} llvm-${{ env.LLVM_VERSION }} clang-tools-${{ env.LLVM_VERSION }}
          echo "/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin" >> $GITHUB_PATH
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      - name: Verify Clang available
        run: clang++ --version
      - name: Run example project tests
        run: cargo test --test example_projects -- --nocapture
      - name: Run real project tests
        run: cargo test --test real_projects -- --nocapture
      - name: Run E2E validation tests
        run: cargo test --test e2e_validation -- --nocapture

  msrv:
    name: MSRV (1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all

  gcc-backend:
    name: GCC backend (ubuntu, g++-14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install g++-14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Build cmod
        run: cargo build -p cmod-cli
      - name: End-to-end module build with GCC
        run: |
          set -x
          mkdir /tmp/gccproj && cd /tmp/gccproj
          $GITHUB_WORKSPACE/target/debug/cmod init --name gccdemo
          sed -i 's/compiler = "clang"/compiler = "gcc"/' cmod.toml
          CXX=g++-14 $GITHUB_WORKSPACE/target/debug/cmod build --verbose
          ls build/debug/pcm/
          test -f build/debug/pcm/local_gccdemo.gcm
          ./build/debug/gccdemo
          CXX=g++-14 $GITHUB_WORKSPACE/target/debug/cmod test

  cross-target:
    name: Cross-target smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Plan-level cross-compilation checks: --target with a non-host triple
      # must flow into the build plan and emitted compiler flags (#54).
      # No cross toolchain is installed — nothing is compiled.
      - run: cargo test --test cli_integration test_cross_target -- --nocapture
