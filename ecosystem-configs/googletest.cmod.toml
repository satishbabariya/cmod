[package]
name = "googletest"
version = "1.16.0"
edition = "2023"
authors = []

[module]
name = "com.github.cmod_ecosystem.googletest"
root = "src/lib.cppm"

[dependencies]
"github.com/cmod-ecosystem/abseil-cpp" = "*"

[dev-dependencies]

[build-dependencies]

[features]

[compat]
cpp = ">=20"
